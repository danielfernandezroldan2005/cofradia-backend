spring.application.name=inventary_and_loans

# Conexión a la base de datos (Crea la base de datos 'cofradia_db' si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/cofradia_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# Configuración de Hibernate (ORM)
# 'update' actualiza el esquema de tablas automáticamente al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true